<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<title>HybridSlicer</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  ::-webkit-scrollbar { display: none; }
  html, body { scrollbar-width: none; }
  body {
    font-family: 'Segoe UI', -apple-system, BlinkMacSystemFont, sans-serif;
    background: #0f172a; color: #e2e8f0;
    height: 100vh; display: flex; flex-direction: column;
    user-select: none; overflow: hidden;
  }

  /* ─── Header ──────────────────────────────── */
  .header {
    background: linear-gradient(135deg, #1e1b4b 0%, #1e293b 100%);
    padding: 24px 28px 20px;
    border-bottom: 1px solid rgba(124, 58, 237, 0.2);
    display: flex; align-items: center; gap: 16px;
  }
  .logo {
    width: 48px; height: 48px;
    border-radius: 14px; flex-shrink: 0;
    box-shadow: 0 4px 12px rgba(124, 58, 237, 0.35);
    overflow: hidden;
  }
  .logo img { width: 100%; height: 100%; border-radius: 14px; }
  .header-text h1 {
    font-size: 22px; font-weight: 700; color: #f8fafc;
    letter-spacing: -0.3px;
  }
  .header-text .version {
    font-size: 11px; color: #a78bfa; margin-top: 2px;
    font-weight: 500; letter-spacing: 0.5px;
  }

  /* ─── Body ────────────────────────────────── */
  .body { flex: 1; padding: 20px 28px; display: flex; flex-direction: column; gap: 16px; overflow-y: auto; }

  /* Status card */
  .status-card {
    background: #1e293b; border: 1px solid #334155; border-radius: 12px;
    padding: 16px 20px; display: flex; align-items: center; gap: 14px;
  }
  .status-icon {
    width: 40px; height: 40px; border-radius: 10px;
    display: flex; align-items: center; justify-content: center;
    font-size: 18px; flex-shrink: 0;
  }
  .status-icon.starting { background: rgba(245, 158, 11, 0.15); }
  .status-icon.running  { background: rgba(34, 197, 94, 0.15); }
  .status-icon.error    { background: rgba(239, 68, 68, 0.15); }
  .status-info { flex: 1; }
  .status-title { font-size: 14px; font-weight: 600; }
  .status-title.starting { color: #fbbf24; }
  .status-title.running  { color: #4ade80; }
  .status-title.error    { color: #f87171; }
  .status-sub { font-size: 12px; color: #64748b; margin-top: 2px; }
  .pulse-dot {
    width: 10px; height: 10px; border-radius: 50%; flex-shrink: 0;
  }
  .pulse-dot.starting { background: #f59e0b; animation: pulse 2s infinite; }
  .pulse-dot.running  { background: #22c55e; }
  .pulse-dot.error    { background: #ef4444; }
  @keyframes pulse { 0%,100%{opacity:1} 50%{opacity:.3} }

  /* Network card */
  .network-card {
    background: #1e293b; border: 1px solid #334155; border-radius: 12px;
    padding: 16px 20px;
  }
  .network-top {
    display: flex; align-items: center; justify-content: space-between;
    margin-bottom: 8px;
  }
  .network-label {
    font-size: 10px; text-transform: uppercase; letter-spacing: 1px;
    color: #7c3aed; font-weight: 700;
  }
  .btn-edit-ip {
    background: rgba(124, 58, 237, 0.1); border: 1px solid rgba(124, 58, 237, 0.25);
    color: #a78bfa; font-size: 11px; font-weight: 600;
    padding: 4px 12px; border-radius: 6px; cursor: pointer;
    transition: all 0.15s;
  }
  .btn-edit-ip:hover { background: rgba(124, 58, 237, 0.2); color: #c4b5fd; }
  .network-url {
    font-size: 20px; font-weight: 700; color: #e2e8f0;
    font-family: 'Cascadia Code', 'Consolas', 'Courier New', monospace;
    word-break: break-all; line-height: 1.3;
  }
  .network-hint {
    font-size: 11px; color: #475569; margin-top: 8px;
    line-height: 1.4;
  }

  /* IP picker panel */
  .ip-picker {
    display: none; margin-top: 12px;
    animation: slideIn 0.2s ease-out;
  }
  .ip-picker.visible { display: block; }
  .ip-picker-label {
    font-size: 11px; color: #94a3b8; font-weight: 600; margin-bottom: 8px;
  }
  .ip-list { display: flex; flex-direction: column; gap: 6px; margin-bottom: 10px; }
  .ip-option {
    display: flex; align-items: center; gap: 10px;
    background: #0f172a; border: 1px solid #334155; border-radius: 8px;
    padding: 10px 14px; cursor: pointer; transition: all 0.15s;
  }
  .ip-option:hover { border-color: #7c3aed; background: rgba(124, 58, 237, 0.05); }
  .ip-option.active { border-color: #7c3aed; background: rgba(124, 58, 237, 0.1); }
  .ip-radio {
    width: 16px; height: 16px; border-radius: 50%;
    border: 2px solid #475569; flex-shrink: 0;
    display: flex; align-items: center; justify-content: center;
  }
  .ip-option.active .ip-radio { border-color: #7c3aed; }
  .ip-option.active .ip-radio::after {
    content: ''; width: 8px; height: 8px; border-radius: 50%; background: #7c3aed;
  }
  .ip-addr {
    font-family: 'Cascadia Code', 'Consolas', monospace;
    font-size: 14px; font-weight: 600; color: #e2e8f0;
  }
  .ip-iface { font-size: 11px; color: #64748b; margin-left: auto; margin-right: 8px; }
  .ip-status {
    width: 8px; height: 8px; border-radius: 50%; flex-shrink: 0;
  }
  .ip-status.reachable { background: #22c55e; }
  .ip-status.unreachable { background: #ef4444; }
  .ip-status.checking { background: #f59e0b; animation: pulse 1s infinite; }
  .ip-warn {
    font-size: 11px; color: #f59e0b; background: rgba(245, 158, 11, 0.1);
    border: 1px solid rgba(245, 158, 11, 0.2); border-radius: 8px;
    padding: 8px 12px; margin-top: 8px; line-height: 1.4;
    display: none;
  }
  .ip-warn.visible { display: block; }
  .ip-custom {
    display: flex; gap: 8px; margin-top: 8px;
  }
  .ip-input {
    flex: 1; background: #0f172a; border: 1px solid #334155; border-radius: 8px;
    padding: 8px 12px; color: #e2e8f0; font-size: 13px;
    font-family: 'Cascadia Code', 'Consolas', monospace;
    outline: none; transition: border-color 0.15s;
  }
  .ip-input:focus { border-color: #7c3aed; }
  .ip-input::placeholder { color: #475569; }
  .btn-apply {
    background: #7c3aed; color: white; border: none; border-radius: 8px;
    padding: 8px 16px; font-size: 12px; font-weight: 600; cursor: pointer;
    transition: all 0.15s; white-space: nowrap;
  }
  .btn-apply:hover { background: #a78bfa; }

  /* Update banner */
  .update-banner {
    background: linear-gradient(135deg, #1e1b4b 0%, #312e81 100%);
    border: 1px solid rgba(124, 58, 237, 0.3);
    border-radius: 12px; padding: 16px 20px;
    display: none;
    animation: slideIn 0.3s ease-out;
  }
  .update-banner.visible { display: block; }
  @keyframes slideIn { from { opacity: 0; transform: translateY(-8px); } to { opacity: 1; transform: translateY(0); } }

  .update-header {
    display: flex; align-items: center; gap: 10px; margin-bottom: 10px;
  }
  .update-badge {
    background: #7c3aed; color: white; font-size: 10px; font-weight: 700;
    padding: 3px 8px; border-radius: 6px; text-transform: uppercase;
    letter-spacing: 0.5px;
  }
  .update-title { font-size: 14px; font-weight: 600; color: #e2e8f0; }
  .update-msg { font-size: 13px; color: #c4b5fd; margin-bottom: 12px; line-height: 1.4; }

  .update-actions { display: flex; gap: 8px; }
  .btn-update {
    padding: 8px 20px; border-radius: 8px; border: none; cursor: pointer;
    font-size: 13px; font-weight: 600; transition: all 0.15s;
  }
  .btn-update:hover { transform: translateY(-1px); }
  .btn-update:disabled { opacity: .5; cursor: not-allowed; transform: none; }
  .btn-update.primary { background: #7c3aed; color: white; }
  .btn-update.primary:hover { background: #a78bfa; }
  .btn-update.ghost { background: transparent; color: #a78bfa; border: 1px solid rgba(124, 58, 237, 0.3); }
  .btn-update.ghost:hover { background: rgba(124, 58, 237, 0.1); }

  .progress-track {
    height: 4px; background: rgba(124, 58, 237, 0.2); border-radius: 2px;
    overflow: hidden; margin-top: 10px; display: none;
  }
  .progress-track.visible { display: block; }
  .progress-fill { height: 100%; background: #7c3aed; width: 0%; transition: width 0.3s; border-radius: 2px; }

  /* Open button */
  .btn-open {
    padding: 14px 24px; border-radius: 12px; border: none; cursor: pointer;
    font-size: 15px; font-weight: 600; transition: all 0.15s;
    background: linear-gradient(135deg, #7c3aed 0%, #6d28d9 100%);
    color: white; width: 100%;
    box-shadow: 0 4px 12px rgba(124, 58, 237, 0.3);
  }
  .btn-open:hover { transform: translateY(-1px); box-shadow: 0 6px 16px rgba(124, 58, 237, 0.4); }
  .btn-open:active { transform: translateY(0); }

  /* Footer */
  .footer {
    padding: 12px 28px; border-top: 1px solid #1e293b;
    font-size: 11px; color: #475569; text-align: center;
    display: flex; justify-content: space-between; align-items: center;
  }
  .footer-left { opacity: 0.7; }
  .footer-right { display: flex; align-items: center; gap: 10px; }
  .footer-version { color: #7c3aed; font-weight: 500; }
  .btn-check-update {
    background: rgba(124, 58, 237, 0.1); border: 1px solid rgba(124, 58, 237, 0.2);
    color: #a78bfa; font-size: 10px; font-weight: 600; padding: 3px 10px;
    border-radius: 5px; cursor: pointer; transition: all 0.15s;
  }
  .btn-check-update:hover { background: rgba(124, 58, 237, 0.2); color: #c4b5fd; }
  .btn-check-update:disabled { opacity: 0.4; cursor: not-allowed; }
  .btn-check-update.checking { animation: pulse 1.5s infinite; }
</style>
</head>
<body>

<div class="header">
  <div class="logo"><img id="appLogo" src="" alt="HS"/></div>
  <div class="header-text">
    <h1>HybridSlicer</h1>
    <div class="version" id="versionLabel">Hybrid Manufacturing Slicer</div>
  </div>
</div>

<div class="body">
  <div class="status-card">
    <div class="status-icon starting" id="statusIcon">
      <div class="pulse-dot starting" id="pulseDot"></div>
    </div>
    <div class="status-info">
      <div class="status-title starting" id="statusTitle">Starting server...</div>
      <div class="status-sub" id="statusSub">Initializing services</div>
    </div>
  </div>

  <div class="network-card">
    <div class="network-top">
      <div class="network-label">Network Address</div>
      <button class="btn-edit-ip" id="btnEditIP" onclick="toggleIPPicker()">Change IP</button>
    </div>
    <div class="network-url" id="urlValue">Detecting...</div>
    <div class="network-hint">Access HybridSlicer at this address on the same network</div>

    <div class="ip-picker" id="ipPicker">
      <div class="ip-picker-label">Select a network interface or enter a custom IP</div>
      <div class="ip-list" id="ipList"></div>
      <div class="ip-warn" id="ipWarn"></div>
      <div class="ip-custom">
        <input class="ip-input" id="customIP" type="text" placeholder="Enter custom IP (e.g. 192.168.1.100)" />
        <button class="btn-apply" onclick="applyCustomIP()">Apply</button>
      </div>
    </div>
  </div>

  <div class="update-banner" id="updateBanner">
    <div class="update-header">
      <span class="update-badge" id="updateBadge">Update</span>
      <span class="update-title" id="updateTitle"></span>
    </div>
    <div class="update-msg" id="updateMsg"></div>
    <div class="update-actions" id="updateActions"></div>
    <div class="progress-track" id="progressTrack">
      <div class="progress-fill" id="progressFill"></div>
    </div>
  </div>

  <button class="btn-open" onclick="openBrowser()">Open HybridSlicer in Browser</button>
</div>

<div class="footer">
  <span class="footer-left">Minimise to tray &middot; Right-click tray to quit</span>
  <div class="footer-right">
    <button class="btn-check-update" id="btnCheckUpdate" onclick="manualCheckUpdate()">Check for Updates</button>
    <span class="footer-version" id="footerVersion"></span>
  </div>
</div>

<script>
  var statusIcon  = document.getElementById('statusIcon');
  var pulseDot    = document.getElementById('pulseDot');
  var statusTitle = document.getElementById('statusTitle');
  var statusSub   = document.getElementById('statusSub');
  var urlEl       = document.getElementById('urlValue');
  var versionLabel = document.getElementById('versionLabel');
  var footerVersion = document.getElementById('footerVersion');
  var updateBanner = document.getElementById('updateBanner');
  var updateBadge  = document.getElementById('updateBadge');
  var updateTitle  = document.getElementById('updateTitle');
  var updateMsg    = document.getElementById('updateMsg');
  var updateActions = document.getElementById('updateActions');
  var progressTrack = document.getElementById('progressTrack');
  var progressFill  = document.getElementById('progressFill');
  var ipPicker     = document.getElementById('ipPicker');
  var ipList       = document.getElementById('ipList');
  var customIP     = document.getElementById('customIP');
  var btnEditIP    = document.getElementById('btnEditIP');
  var btnCheck     = document.getElementById('btnCheckUpdate');

  var currentIP = '';
  var currentURL = '';
  var currentPort = 5000;

  function applyStatus(data) {
    if (data.lanIP)   currentIP = data.lanIP;
    if (data.port)    currentPort = data.port;
    if (data.url)     currentURL = data.url;
    if (data.version) {
      versionLabel.textContent = 'v' + data.version + ' \u2014 Hybrid Manufacturing Slicer';
      footerVersion.textContent = 'v' + data.version;
    }
    urlEl.textContent = currentURL || 'Detecting...';
    var s = data.status || 'starting';

    statusIcon.className = 'status-icon ' + s;
    pulseDot.className = 'pulse-dot ' + s;
    statusTitle.className = 'status-title ' + s;

    if (s === 'running') {
      statusTitle.textContent = 'Server Running';
      statusSub.textContent = 'All services operational';
    } else if (s === 'error' || s === 'stopped') {
      statusTitle.textContent = 'Server Stopped';
      statusSub.textContent = 'Process has exited';
    } else {
      statusTitle.textContent = 'Starting Server...';
      statusSub.textContent = 'Initializing services';
    }
  }

  function openBrowser() {
    window.chrome.webview.postMessage({ action: 'open-browser' });
  }

  function toggleIPPicker() {
    var visible = ipPicker.classList.toggle('visible');
    btnEditIP.textContent = visible ? 'Close' : 'Change IP';
    if (visible) window.chrome.webview.postMessage({ action: 'get-all-ips' });
  }

  function loadIPs(ips) {
    ipList.innerHTML = '';
    document.getElementById('ipWarn').classList.remove('visible');
    for (var i = 0; i < ips.length; i++) {
      var item = ips[i];
      var div = document.createElement('div');
      div.className = 'ip-option' + (item.ip === currentIP ? ' active' : '');
      div.innerHTML = '<div class="ip-radio"></div><span class="ip-addr">' + item.ip + '</span><span class="ip-iface">' + item.name + '</span><div class="ip-status checking" data-ip="' + item.ip + '"></div>';
      div.setAttribute('data-ip', item.ip);
      div.onclick = function() { selectIP(this.getAttribute('data-ip')); };
      ipList.appendChild(div);
    }
    for (var j = 0; j < ips.length; j++) {
      window.chrome.webview.postMessage({ action: 'test-ip', ip: ips[j].ip, port: currentPort });
    }
  }

  function ipTestResult(ip, reachable) {
    var dot = document.querySelector('.ip-status[data-ip="' + ip + '"]');
    if (dot) {
      dot.className = 'ip-status ' + (reachable ? 'reachable' : 'unreachable');
    }
  }

  function selectIP(ip) {
    window.chrome.webview.postMessage({ action: 'set-ip', ip: ip });
  }

  function ipChanged(ip, url) {
    currentIP = ip;
    currentURL = url;
    urlEl.textContent = currentURL;
    var opts = document.querySelectorAll('.ip-option');
    for (var i = 0; i < opts.length; i++) {
      var addr = opts[i].querySelector('.ip-addr').textContent;
      opts[i].classList.toggle('active', addr === ip);
    }
    setTimeout(function() {
      ipPicker.classList.remove('visible');
      btnEditIP.textContent = 'Change IP';
    }, 300);
  }

  function applyCustomIP() {
    var ip = customIP.value.trim();
    if (!ip) return;
    window.chrome.webview.postMessage({ action: 'set-ip', ip: ip });
    customIP.value = '';
  }

  function manualCheckUpdate() {
    btnCheck.disabled = true;
    btnCheck.classList.add('checking');
    btnCheck.textContent = 'Checking...';
    window.chrome.webview.postMessage({ action: 'check-for-update' });
    setTimeout(function() {
      if (!updateBanner.classList.contains('visible')) {
        btnCheck.textContent = 'Up to date';
        setTimeout(function() {
          btnCheck.textContent = 'Check for Updates';
          btnCheck.disabled = false;
          btnCheck.classList.remove('checking');
        }, 2000);
      } else {
        btnCheck.textContent = 'Check for Updates';
        btnCheck.disabled = false;
        btnCheck.classList.remove('checking');
      }
    }, 4000);
  }

  function showBanner(title, msg, buttons) {
    updateBanner.classList.add('visible');
    updateTitle.textContent = title;
    updateMsg.textContent = msg;
    updateActions.innerHTML = '';
    if (buttons) {
      for (var i = 0; i < buttons.length; i++) {
        var b = buttons[i];
        var btn = document.createElement('button');
        btn.className = 'btn-update ' + (b.style || 'primary');
        btn.textContent = b.label;
        btn.onclick = b.action;
        updateActions.appendChild(btn);
      }
    }
    btnCheck.textContent = 'Check for Updates';
    btnCheck.disabled = false;
    btnCheck.classList.remove('checking');
  }

  function hideBanner() { updateBanner.classList.remove('visible'); }

  function onUpdateAvailable(version) {
    showBanner(
      'Version ' + version + ' Available',
      'A new version of HybridSlicer is ready. Would you like to download and install it?',
      [
        { label: 'Update Now', style: 'primary', action: function() {
            window.chrome.webview.postMessage({ action: 'download-update' });
            updateActions.innerHTML = '';
            updateMsg.textContent = 'Downloading update...';
            updateBadge.textContent = 'Downloading';
            progressTrack.classList.add('visible');
        }},
        { label: 'Later', style: 'ghost', action: function() { hideBanner(); } }
      ]
    );
  }

  function onDownloadProgress(percent) {
    progressTrack.classList.add('visible');
    progressFill.style.width = percent + '%';
    updateMsg.textContent = 'Downloading update... ' + percent + '%';
  }

  function onUpdateDownloaded() {
    progressTrack.classList.remove('visible');
    updateBadge.textContent = 'Ready';
    showBanner('Update Ready', 'The update has been downloaded. HybridSlicer will restart to apply the update.', [
      { label: 'Restart Now', style: 'primary', action: function() { window.chrome.webview.postMessage({ action: 'install-update' }); } },
      { label: 'Later', style: 'ghost', action: function() { hideBanner(); } }
    ]);
  }

  function onUpdateError(message) {
    showBanner('Update Check Failed', message || 'Could not check for updates. Will retry on next launch.',
      [{ label: 'Dismiss', style: 'ghost', action: function() { hideBanner(); } }]);
  }
</script>
</body>
</html>
